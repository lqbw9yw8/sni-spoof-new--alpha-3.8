# dpi_guard CI — REAL, executed by GitHub on every push/PR.
#
# Until 2026-09-23 this repository had NO .github/workflows directory at all:
# the YAML lived in ci/ and every "CI passes" claim was unfalsifiable
# (`gh run list` returned nothing). This file is the workflow that actually
# executes; ci/ci.yml is kept as a byte-identical template copy.
#
# Includes the `cargo fmt --all -- --check` gate: the tree is formatted as of
# the fix round that added these workflows, so the cosmetic gate no longer
# hides build/test results.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting gate
        run: cargo fmt --all -- --check

  rust:
    name: cargo build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # On Windows the windivert-sys build script links the official SDK from
      # WINDIVERT_PATH (pinned to the repo root by .cargo/config.toml). The
      # binaries are deliberately not in git, so fetch the hash-verified
      # official release first. Linux builds/tests use engine_stub.rs and
      # never link WinDivert.
      - name: Fetch pinned WinDivert SDK (Windows linking)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-windivert.ps1 -Arch x64

      # The crate is Windows-only for packet I/O (WinDivert) but carries
      # src/engine_stub.rs so the pure logic still builds and tests on
      # Linux — this job is the whole point of that stub.
      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    continue-on-error: true # report, do not mask build/test results
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  webui:
    # The dashboard (src/webui/index.html) is plain HTML/JS with no build
    # step, so it gets its own job: it loads the REAL page in jsdom against
    # a mock of the webui API and asserts every Settings field is editable,
    # that validation matches Settings::validate, that the mock's /api/status
    # matches status_json() in src/webui.rs field-for-field, and that the
    # emitted TOML parses with a real TOML parser.
    name: dashboard UI tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install harness dependencies
        working-directory: uitest
        run: npm ci
      - name: Run dashboard + schema-coverage tests
        working-directory: uitest
        run: npm test

  docs:
    name: docs + status are derived, not hand-written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TEST_MATRIX.md is up to date with the source
        run: python3 tools/gen_status.py --check
      - name: docs/code parity
        run: python3 tools/lint_docs.py
      - name: duplicate report (informational)
        run: python3 tools/dup_report.py
